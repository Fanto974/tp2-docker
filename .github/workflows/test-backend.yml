name: Test backend
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Fetch the code (full history so SonarCloud can compute "new code" and blame)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build, test and analyse with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Fanto974_tp2-docker
          -Dsonar.organization=fanto974
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simple-api/pom.xml
