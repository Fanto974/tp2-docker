---
- name: Run database
  community.docker.docker_container:
    name: "{{ db_container_name }}"
    image: "{{ db_image }}"
    pull: true
    state: started
    restart_policy: always
    networks:
      - name: "{{ network_name }}"
    env:
      POSTGRES_DB: "{{ db_name }}"
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
